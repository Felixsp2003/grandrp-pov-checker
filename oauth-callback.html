<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grand RP · YouTube Verbindung</title><style>body{margin:0;background:#08060f;color:#f5effb;font-family:Inter,system-ui,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(560px,calc(100% - 32px));background:#0f0b18;border:1px solid #281b37;border-radius:14px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.45)}h1{margin:0 0 8px;font-size:22px}p{color:#aaa0b0;line-height:1.5}.ok{color:#69e1af}.err{color:#ff8ebd}.small{font-size:12px}</style></head><body><div class="card"><h1 id="title">YouTube wird verbunden…</h1><p id="msg">Bitte warten. Google leitet dich zurück zur Website.</p></div><script>(function(){'use strict';const TOKEN='yt_access_token',STATE='grandrp_oauth_state_v36',RESULT='grandrp_oauth_result_v36';function done(msg,ok){document.getElementById('title').textContent=ok?'YouTube verbunden':'YouTube-Verbindung fehlgeschlagen';document.getElementById('msg').textContent=msg;document.getElementById('msg').className=ok?'ok':'err';}const hash=new URLSearchParams(location.hash.replace(/^#/,''));const expected=sessionStorage.getItem(STATE)||'';const returned=hash.get('state')||'';const token=hash.get('access_token');const error=hash.get('error');const desc=hash.get('error_description')||'';history.replaceState(null,document.title,location.pathname);sessionStorage.removeItem(STATE);if(expected&&returned!==expected){const m='Sicherheitsprüfung fehlgeschlagen (state).';sessionStorage.setItem(RESULT,JSON.stringify({message:m}));done(m,false);setTimeout(()=>location.replace('./'),900);return;}if(error||!token){const m=desc||error||'Google hat kein Zugriffstoken zurückgegeben.';sessionStorage.setItem(RESULT,JSON.stringify({message:'Google OAuth: '+m}));done(m,false);setTimeout(()=>location.replace('./'),1200);return;}sessionStorage.setItem(TOKEN,token);sessionStorage.setItem(RESULT,JSON.stringify({message:'YouTube ist verbunden.'}));done('Verbindung erfolgreich. Du wirst zurück zur Website geleitet.',true);setTimeout(()=>location.replace('./'),700);})();</script></body></html>
