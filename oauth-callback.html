<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grand RP · Google-Verbindung</title><style>body{margin:0;background:#08060f;color:#f5effb;font-family:Inter,system-ui,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(560px,calc(100% - 32px));background:#0f0b18;border:1px solid #281b37;border-radius:14px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.45)}h1{margin:0 0 8px;font-size:22px}p{color:#aaa0b0;line-height:1.5}.ok{color:#69e1af}.err{color:#ff8ebd}.small{font-size:12px}</style></head><body><div class="card"><h1 id="title">Google-Verbindung wird hergestellt…</h1><p id="msg">Bitte warten. Google leitet dich zurück zur Website.</p></div><script>(function(){'use strict';
const PENDING='grandrp_youtube_oauth_pending_v89',RESULT='grandrp_oauth_result_v89',CONNS='grandrp_youtube_connections_v89',DRIVE_STATE='grandrp_drive_oauth_state_v127',DRIVE_RESULT='grandrp_drive_oauth_result_v127',DRIVE_PENDING='grandrp_drive_oauth_pending_v127';
const hash=new URLSearchParams(location.hash.replace(/^#/,'')||'');
const returned=String(hash.get('state')||'');
function readPending(key){try{const raw=localStorage.getItem(key)||sessionStorage.getItem(key)||'';return raw?JSON.parse(raw):null;}catch{return null;}}
const ytPending=readPending(PENDING);const drivePending=readPending(DRIVE_PENDING);
// One callback page serves both flows. Resolve the flow by the returned OAuth state,
// otherwise a Drive callback could incorrectly be treated as a YouTube callback.
const pending=(drivePending&&returned&&String(drivePending.state||'')===returned)?drivePending:((ytPending&&returned&&String(ytPending.state||'')===returned)?ytPending:(drivePending||ytPending||null));
const expected=String(pending?.state||'');
const token=String(hash.get('access_token')||'');
const expiresIn=Number(hash.get('expires_in')||3600);
const error=String(hash.get('error')||'');
const desc=String(hash.get('error_description')||'');
function done(msg,ok){const isDrive=pending?.purpose==='drive';document.getElementById('title').textContent=ok?(isDrive?'Google Drive verbunden':'YouTube verbunden'):(isDrive?'Google-Drive-Verbindung fehlgeschlagen':'YouTube-Verbindung fehlgeschlagen');document.getElementById('msg').textContent=msg;document.getElementById('msg').className=ok?'ok':'err';}
try{history.replaceState(null,document.title,location.pathname)}catch{}
const pendingKey=pending?.purpose==='drive'?DRIVE_PENDING:PENDING;
if(error||!token){const m=desc||error||(pending?.purpose==='drive'?'Google hat kein Drive-Zugriffstoken zurückgegeben.':'Google hat kein Zugriffstoken zurückgegeben.');if(pending?.purpose==='drive'){localStorage.setItem(DRIVE_RESULT,JSON.stringify({message:m,ok:false}));}else{localStorage.setItem(RESULT,JSON.stringify({message:`Verbindung ${pending?.slot||''}: ${m}`,ok:false,slot:pending?.slot||0}));}localStorage.removeItem(pendingKey);sessionStorage.removeItem(pendingKey);done(m,false);setTimeout(()=>location.replace('./'),1400);return;}
if(!pending||!expected||returned!==expected){const isDrive=!!(drivePending&&returned&&String(drivePending.state||'')===returned)||pending?.purpose==='drive';const m=isDrive?'Sicherheitsprüfung für Google Drive fehlgeschlagen. Bitte Google Drive erneut verbinden.':'Sicherheitsprüfung für YouTube fehlgeschlagen. Bitte die betroffene YouTube-Verbindung erneut verbinden.';if(isDrive){localStorage.setItem(DRIVE_RESULT,JSON.stringify({message:m,ok:false}));}else{localStorage.setItem(RESULT,JSON.stringify({message:m,ok:false,slot:pending?.slot||0}));}const key=isDrive?DRIVE_PENDING:PENDING;localStorage.removeItem(key);sessionStorage.removeItem(key);done(m,false);setTimeout(()=>location.replace('./'),1400);return;}
if(pending?.purpose==='drive'){localStorage.setItem(DRIVE_STATE,JSON.stringify({version:2,updatedAt:Date.now(),clientId:String(pending.clientId||''),accessToken:token,tokenExpiresAt:Date.now()+Math.max(60,expiresIn-30)*1000,connected:true,accountHint:'same-as-youtube-1'}));localStorage.setItem(DRIVE_RESULT,JSON.stringify({message:'Google Drive ist verbunden. Bitte dasselbe Google-Konto wie bei YouTube-Verbindung 1 verwenden.',ok:true}));localStorage.removeItem(DRIVE_PENDING);sessionStorage.removeItem(DRIVE_PENDING);done('Google Drive erfolgreich verbunden. Du wirst zur Website zurückgeleitet.',true);setTimeout(()=>location.replace('./'),700);return;}
const list=getConns();const slot=Math.min(3,Math.max(1,Number(pending.slot)||1));const c=list.find(x=>Number(x.slot)===slot)||list[slot-1];if(!c){done('YouTube-Verbindung konnte nicht gefunden werden.',false);return;}
c.clientId=String(pending.clientId||c.clientId||'').trim();c.accessToken=token;c.tokenExpiresAt=Date.now()+Math.max(60,expiresIn-30)*1000;c.blockedUntil=0;c.blockedReason='';c.lastError='';c.connected=!!(c.clientId&&c.accessToken);c.updatedAt=Date.now();setConns(list);
// Keep the legacy single-slot keys in sync for older builds/data migration only.
if(slot===1){localStorage.setItem('yt_client_id',c.clientId);localStorage.setItem('yt_access_token',c.accessToken);localStorage.setItem('yt_access_expires_at_v50',String(c.tokenExpiresAt));}
localStorage.setItem(RESULT,JSON.stringify({message:`YouTube-Verbindung ${slot} ist verbunden.`,ok:true,slot}));localStorage.removeItem(PENDING);sessionStorage.removeItem(PENDING);done(`Verbindung ${slot} erfolgreich. Du wirst zur Website zurückgeleitet.`,true);setTimeout(()=>location.replace('./'),700);
})();</script></body></html>
